spring.application.name=convivir
server.port=8080

# La conexion llega por variables de entorno (las pone docker-compose desde el archivo .env).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false

# Las tablas salen de las clases del dominio (@Entity). "update" las crea y agrega
# columnas nuevas sin borrar datos. Antes de entregar se cambia por migraciones.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota
# Las listas (obligaciones, vinculaciones…) se cargan de a 50 inmuebles por consulta, no una por fila.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Un sí/no o un número que no llega en el JSON vale false o 0 (Jackson 3 lo rechaza por defecto).
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Los errores salen como JSON con el mensaje de la regla, sin la traza.
server.error.include-stacktrace=never

# Sesión: cookie solo para el servidor (el JavaScript no la lee) y que no viaja en peticiones de otros sitios.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Contraseña de las cuentas de ejemplo. Va en el archivo .env, nunca en el código.
convivir.contrasena-inicial=${CONVIVIR_CONTRASENA_INICIAL:}
